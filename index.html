<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>拾作審美練習</title>
<style>
:root{--bg:#0b0d10;--surface:#12161b;--surface2:#171c22;--line:#222a33;--line2:#2c3540;--text:#e7eaee;--muted:#8b95a1;--dim:#5f6873;
  --accent:#2f8cff;--accent-soft:rgba(47,140,255,.14);--good:#3ccf91;--warn:#f2b84b;--bad:#ef6b6b;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--muted);text-decoration:underline;text-underline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:0 14px 90px}
header.top{position:sticky;top:0;z-index:20;background:rgba(11,13,16,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topin{max-width:860px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:12px}
.brand{font-weight:700;white-space:nowrap}
nav.tabs{display:flex;gap:2px;margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
nav.tabs a{color:var(--muted);padding:5px 13px;border-radius:999px;font-size:14px;white-space:nowrap;text-decoration:none}
nav.tabs a.on{background:var(--surface2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
@media(max-width:520px){.brand{font-size:14px}nav.tabs a{padding:5px 10px;font-size:13px}}
.prog{color:var(--muted);font-size:13px;margin:0 0 8px}
.qcard,.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px;scroll-margin-top:70px}
.rcard{border-color:rgba(242,184,75,.55)}
.focus{background:var(--surface2);border-left:3px solid var(--warn);border-radius:8px;padding:8px 12px;font-size:15px}
.focus .lab{display:block;font-size:12px;color:var(--warn);font-weight:700;margin-bottom:2px}
.decide{font-size:20px;font-weight:700;line-height:1.45;margin:12px 0 2px}
@media(max-width:520px){.decide{font-size:18px}}
.tech{color:var(--muted);font-size:14px;margin-bottom:10px}
.tech b{color:var(--text);font-weight:600}
.yt{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.meta{font-size:13px;color:var(--muted);margin-top:8px;display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center}
.meta .sp{margin-left:auto;display:flex;gap:12px}
.meta button{background:none;border:0;padding:0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.choices{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}
.choices button{background:var(--surface2);border:1px solid var(--line2);border-radius:12px;padding:14px 6px;font-weight:700;font-size:16px}
.choices button.skip{font-weight:500;font-size:14px;color:var(--muted)}
.choices button.on{border-color:var(--text);box-shadow:0 0 0 1px var(--text)}
.choices button:active{transform:scale(.98)}
.choices button[disabled]{opacity:.5}
@media(max-width:400px){.choices button{font-size:15px;padding:13px 4px}}
.noted{margin-top:14px;font-size:15px}
.noted .n{color:var(--muted);font-size:13px;display:block}
.uses{margin-top:12px}
.uses .h{font-size:13px;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--line2);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer;user-select:none}
.chip input{margin:0;width:15px;height:15px;accent-color:var(--accent)}
.chip.on{border-color:var(--text)}
details.fold{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
details.fold summary{cursor:pointer;color:var(--muted);font-size:14px;list-style:none}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary:before{content:"▸ ";color:var(--dim)}
details.fold[open] summary:before{content:"▾ "}
details.fold .in{font-size:14px;margin-top:6px}
details.fold ul{margin:4px 0 0;padding-left:18px}
.row{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.btn{background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:8px 14px;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.link{background:none;border:0;color:var(--muted);padding:8px 4px}
.btn[disabled]{opacity:.5}
.right{margin-left:auto}
input[type=text]{flex:1;min-width:0;background:#0e1115;border:1px solid var(--line2);border-radius:10px;color:var(--text);font:inherit;padding:9px 12px}
input[type=text]:focus{outline:none;border-color:var(--accent)}
.comment{font-size:13px;color:var(--muted);margin-top:8px}
.donebox{background:linear-gradient(180deg,rgba(60,207,145,.08),transparent);border:1px solid rgba(60,207,145,.3);border-radius:var(--r);padding:18px;margin-top:16px}
.donebox h2{margin:0 0 6px;font-size:19px}
.donebox ul{margin:6px 0 0;padding-left:18px}
.rcard h2{font-size:16px;margin:0 0 4px;line-height:1.5}
.rcard .stl{color:var(--muted);font-size:13px;margin-bottom:10px}
.rvid{border-radius:12px;overflow:hidden;background:#05080f;aspect-ratio:16/9}
.rvid video{display:block;width:100%;height:100%;object-fit:contain}
.empty{color:var(--muted);text-align:center;padding:48px 10px}
.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
.filters{display:flex;gap:8px;margin:18px 0 8px;flex-wrap:wrap;align-items:center}
.filters h1{font-size:20px;margin:0 auto 0 0}
.fbtn{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
.fbtn.on{border-color:var(--text);color:var(--text)}
.day{border-top:1px solid var(--line);padding:10px 0}
.day .d{color:var(--muted);font-size:13px;margin-bottom:4px}
.hrow{display:flex;gap:10px;align-items:baseline;width:100%;background:none;border:0;text-align:left;padding:6px 0;font-size:15px}
.hrow .num{color:var(--dim);font-size:13px;min-width:16px}
.hrow .ans{margin-left:auto;white-space:nowrap;font-weight:700}
.hrow .ans.skip{color:var(--muted);font-weight:500}
.hrow .ans.todo{color:var(--dim);font-weight:500}
.hdetail{margin:4px 0 8px}
.trial{color:var(--dim);font-size:13px;border-top:1px solid var(--line);padding:12px 0}
.tasteh{margin:18px 0 4px}
.tasteh h1{font-size:20px;margin:0}
.tasteh .sum{color:var(--muted);font-size:14px}
.sect{margin-top:20px}
.sect h3{font-size:14px;color:var(--text);font-weight:700;margin:0 0 4px}
.sect .sub{font-size:13px;color:var(--muted);margin:0 0 8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:8px}
.item .t{font-weight:600}
.item .s{color:var(--muted);font-size:13px}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);margin-left:6px;white-space:nowrap;font-weight:500}
.badge.good{color:var(--good);border-color:rgba(60,207,145,.45)}.badge.warn{color:var(--warn);border-color:rgba(242,184,75,.45)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1b222b;border:1px solid var(--line2);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
</style>
</head>
<body>
<header class="top"><div class="topin">
  <div class="brand">拾作審美練習</div>
  <nav class="tabs">
    <a href="#today" data-v="today">今日</a>
    <a href="#history" data-v="history">歷史</a>
    <a href="#taste" data-v="taste">我的審美</a>
  </nav>
</div></header>
<main class="wrap" id="app"><div class="loading">載入中…</div></main>
<div class="toast" id="toast"></div>
<script>
/* v6 GitHub Pages 版:資料在 Google 試算表，透過 Apps Script 網頁應用程式的 JSON API 讀寫 */
var API_URL='https://script.google.com/macros/s/AKfycby3mo0TCoLm_VhK-3bvIti7Mp6b269avp-EuYtMrmkJiGz_UuJ2240UOUsDVA3Rq7a9_g/exec';
var RECREATE_BASE='';
function unwrap(j){if(!j||typeof j!=='object')throw new Error('伺服器回應格式不對');if(!j.ok)throw new Error(j.error||'伺服器錯誤');return j.data}
function jsonp(url){return new Promise(function(ok,no){
  var cb='__aes_cb'+Date.now()+Math.floor(Math.random()*1e4),sc=document.createElement('script'),t=setTimeout(function(){done();no(new Error('連線逾時'))},20000);
  function done(){clearTimeout(t);try{delete window[cb]}catch(e){window[cb]=undefined}if(sc.parentNode)sc.parentNode.removeChild(sc)}
  window[cb]=function(j){done();try{ok(unwrap(j))}catch(e){no(e)}};
  sc.onerror=function(){done();no(new Error('連不上伺服器'))};
  sc.src=url+'&callback='+cb;document.head.appendChild(sc)})}
function apiGet(action,k){
  var url=API_URL+'?action='+encodeURIComponent(action)+'&k='+encodeURIComponent(k||'')+'&_='+Date.now();
  return fetch(url,{method:'GET',cache:'no-store',redirect:'follow',credentials:'omit'})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
    .then(function(j){return{j:j}},function(){return jsonp(url).then(function(d){return{d:d}})})
    .then(function(x){return 'd' in x?x.d:unwrap(x.j)})}
function apiPost(action,k,payload){
  return fetch(API_URL,{method:'POST',redirect:'follow',credentials:'omit',
    headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:action,k:k||'',payload:payload})})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(unwrap)}
function call(fn,k,payload){
  if(fn==='getData')return apiGet('getData6',k);
  if(fn==='saveProChoice'||fn==='recreateAction')return apiPost(fn,k,payload);
  return Promise.reject(new Error('未知的動作 '+fn))}
var KEY_LS='aesthetic_access_key';
function lsGet(){try{return localStorage.getItem(KEY_LS)||''}catch(e){return''}}
function lsSet(v){try{if(v)localStorage.setItem(KEY_LS,v);else localStorage.removeItem(KEY_LS)}catch(e){}}
function start(load,fail,S){
  var qk=new URLSearchParams(location.search).get('k')||'';
  if(qk)lsSet(qk);
  S.key=qk||lsGet();
  if(!S.key){document.getElementById('app').innerHTML='<div class="empty"><b>這台裝置還沒有金鑰</b>請用審美教練給你、網址後面帶 ?k= 的連結開一次，之後就會記住</div>';return}
  load().catch(function(err){var m=String(err&&err.message||err);if(/金鑰/.test(m)&&!qk)lsSet('');fail(err)})}

(function(){
var S={questions:[],choices:{},queue:[],today:'',key:'',hash:'today',hist:'all',open:{},shownAt:{},draft:{},routed:false,loaded:false,busy:{}};
var WD='日一二三四五六';
var CH={take:'收進',part:'只收一部分',skip:'不適合我的片'};
var QS_TXT={queued:'待重現',redo:'重做中',review:'重現版好了，等你看',approved:'你說像，等你按收進',hold:'像，先不收',merge:'等教練寫進指南',merged:'已入指南',cancelled:'已取消'};
var QS_SUB={queued:'教練會照拾作的配色做一支 8 秒重現版',redo:'你說不像，教練會重做',review:'看看重現版像不像原片那招',approved:'按「收進指南」才會寫進剪片指南',hold:'想收的時候再按收進',merge:'教練會先備份再寫進 editing_style_guide.md',merged:'已寫進剪片指南',cancelled:'你改成不適合，不會重現'};
var app=document.getElementById('app');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function lines(s){var a=String(s||'').split(/\n+/).map(function(x){return x.trim()}).filter(String);if(!a.length)return'';if(a.length===1)return'<div>'+esc(a[0])+'</div>';return'<ul>'+a.map(function(x){return'<li>'+esc(x)+'</li>'}).join('')+'</ul>'}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show')},1800)}
function dobj(s){var p=String(s).split('-');return new Date(Date.UTC(+p[0],+p[1]-1,+p[2]))}
function dstr(d){return d.toISOString().slice(0,10)}
function wd(s){return dobj(s).getUTCDay()}
function md(s){var p=String(s).split('-');return (+p[1])+'/'+(+p[2])}
function addDays(s,n){var d=dobj(s);d.setUTCDate(d.getUTCDate()+n);return dstr(d)}
function monday(s){var w=wd(s);return addDays(s,-((w+6)%7))}
function isWeekday(s){var w=wd(s);return w>=1&&w<=5}
function taipeiToday(){return dstr(new Date(Date.now()+8*3600*1000))}
function mss(t){t=Math.max(0,Math.floor(t));return Math.floor(t/60)+':'+('0'+t%60).slice(-2)}
function q(pid){for(var i=0;i<S.questions.length;i++)if(S.questions[i].pid===pid)return S.questions[i];return null}
function ready(){return S.questions.filter(function(x){return (!x.status||x.status==='ready')&&x.videoId})}
function dayQs(d){return ready().filter(function(x){return x.date===d}).sort(function(a,b){return a.slot-b.slot})}
function ch(pid){return S.choices[pid]||null}
function chosen(pid){var c=ch(pid);return !!(c&&c.choice)}
function qrow(pid){for(var i=0;i<S.queue.length;i++)if(S.queue[i].pid===pid)return S.queue[i];return null}
function setQueue(r){if(!r)return;for(var i=0;i<S.queue.length;i++)if(S.queue[i].pid===r.pid){S.queue[i]=r;return}S.queue.push(r)}
function nextReadyDate(){var d=ready().map(function(x){return x.date}).filter(function(d){return d>S.today}).sort();return d[0]||''}
function nextLine(){var n=nextReadyDate();return n?'下一份在 '+md(n)+' ('+WD[wd(n)]+')':'下一份還在準備，好了會通知你'}

/* ---------- YouTube 官方嵌入 (只播這一段) ---------- */
function embedURL(x,auto){
  var u='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(x.videoId)+'?start='+x.start+(x.end?'&end='+x.end:'')+'&rel=0&modestbranding=1&playsinline=1&iv_load_policy=3&cc_load_policy=0&enablejsapi=1';
  try{if(location.origin&&/^https?:/.test(location.origin))u+='&origin='+encodeURIComponent(location.origin)}catch(e){}
  return u+(auto?'&autoplay=1&mute=1':'')}
function watchURL(x){return'https://www.youtube.com/watch?v='+encodeURIComponent(x.videoId)+'&t='+x.start+'s'}
function ytHTML(x,ctx){
  return'<div class="yt"><iframe data-yt="'+esc(ctx+x.pid)+'" src="'+esc(embedURL(x,false))+'" title="'+esc(x.channel+' '+mss(x.start)+'–'+mss(x.end))+'" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>'+
    '<div class="meta"><span>▶ 只播 '+mss(x.start)+'–'+mss(x.end)+' ('+(x.end-x.start)+' 秒)</span><span>'+esc(x.channel)+'</span>'+
    '<span class="sp"><button data-act="replay" data-q="'+esc(x.pid)+'" data-ctx="'+esc(ctx)+'">重播這段</button><a href="'+esc(watchURL(x))+'" target="_blank" rel="noopener">在 YouTube 開啟</a></span></div>'}
function folds(x){
  return'<details class="fold"><summary>好在哪</summary><div class="in">'+esc(x.good)+'</div></details>'+
    '<details class="fold"><summary>參數 (逐格看到的)</summary><div class="in">'+lines(x.params)+'</div></details>'+
    '<details class="fold"><summary>在 Remotion 怎麼做</summary><div class="in">'+lines(x.remotion)+'</div></details>'+
    '<details class="fold"><summary>出處</summary><div class="in">'+esc(x.channel)+(x.region?' ('+esc(x.region)+')':'')+'<br>'+esc(x.title)+'<br>'+mss(x.start)+'–'+mss(x.end)+' · <a href="'+esc(watchURL(x))+'" target="_blank" rel="noopener">YouTube</a><div style="color:var(--dim);font-size:12px;margin-top:4px">影片版權屬原頻道，這裡只用 YouTube 播放器播這一段</div></div></details>'}

/* ---------- 題目卡 ---------- */
function weekDone(){var m=monday(S.today),n=0;for(var i=0;i<5;i++){var qs=dayQs(addDays(m,i));if(qs.length&&qs.every(function(x){return chosen(x.pid)}))n++}return n}
function notedText(c){
  if(c.choice==='take')return'記下了:收進<span class="n">會排進待重現，教練照拾作配色做 8 秒重現版給你看</span>';
  if(c.choice==='part')return'記下了:只收一部分<span class="n">會排進待重現，可以在下面寫是哪一部分</span>';
  return'記下了:這招不適合你的片<span class="n">不會重現，也不會寫進指南</span>'}
function usesHTML(x,c){
  var d=S.draft[x.pid]||(S.draft[x.pid]={uses:(c.uses||[]).slice(),comment:c.comment||''}),opts=(x.uses||[]).slice();
  (c.uses||[]).forEach(function(u){if(opts.indexOf(u)<0)opts.push(u)});
  var h='<div class="uses"><div class="h">'+(c.choice==='skip'?'想補一句為什麼就寫 (可不寫)':'用在哪種畫面 (可複選，可不勾)')+'</div>';
  if(c.choice!=='skip')h+='<div class="chips">'+opts.map(function(u){var on=d.uses.indexOf(u)>=0;return'<label class="chip'+(on?' on':'')+'"><input type="checkbox" data-use="'+esc(x.pid)+'" value="'+esc(u)+'"'+(on?' checked':'')+'>'+esc(u)+'</label>'}).join('')+'</div>';
  h+='<div class="row"><input type="text" maxlength="300" data-cm="'+esc(x.pid)+'" placeholder="'+(c.choice==='part'?'收哪一部分?一句話就好':'一句話，可不寫')+'" value="'+esc(d.comment)+'"><button class="btn" data-act="saveuse" data-q="'+esc(x.pid)+'">存</button></div></div>';
  return h}
function qCard(x,idx,n,opts){
  opts=opts||{};var c=ch(x.pid),done=!!(c&&c.choice)&&!S.open['re_'+x.pid];
  var h='<section class="qcard" id="q-'+esc(x.pid)+'">';
  if(!opts.noProg)h+='<div class="prog">'+md(x.date)+' ('+WD[wd(x.date)]+') · 第 '+idx+' 段/'+n+' · 本週 '+weekDone()+'/5 天</div>';
  h+='<div class="focus"><span class="lab">這題在看什麼</span>'+esc(x.focus)+'</div>'+
    '<div class="decide">這招要不要收進你的指南?</div><div class="tech">這招:<b>'+esc(x.technique)+'</b></div>'+ytHTML(x,opts.ctx||'t');
  if(!done){
    h+='<div class="choices">'+['take','part','skip'].map(function(s){return'<button class="'+s+(c&&c.choice===s?' on':'')+'" data-act="choose" data-q="'+esc(x.pid)+'" data-c="'+s+'"'+(S.busy[x.pid]?' disabled':'')+'>'+CH[s]+'</button>'}).join('')+'</div>';
    if(S.open['re_'+x.pid])h+='<div class="row"><button class="btn link" data-act="cancelre" data-q="'+esc(x.pid)+'">不改了</button></div>';
    h+=folds(x);
  }else{
    var qr=qrow(x.pid);
    h+='<div class="noted">'+notedText(c)+'</div>'+(qr&&c.choice!=='skip'?'<div class="comment">待重現佇列:'+esc(QS_TXT[qr.status]||qr.status)+'</div>':'')+usesHTML(x,c)+folds(x)+
      '<div class="row"><button class="btn right" data-act="re" data-q="'+esc(x.pid)+'">改選</button>'+
      (opts.next?'<button class="btn pri" data-act="next" data-q="'+esc(x.pid)+'">'+(opts.next==='done'?'完成 →':'下一段 →')+'</button>':'')+'</div>';
  }
  return h+'</section>'}

/* ---------- 重現版卡片 (教練做好放上網站後才出現) ---------- */
function rCard(r){
  var x=q(r.pid);if(!x||!r.clip)return'';
  var h='<section class="rcard" id="r-'+esc(r.pid)+'"><h2>重現版:'+esc(x.technique)+'</h2><div class="stl">'+esc(QS_TXT[r.status]||r.status)+' · '+esc(QS_SUB[r.status]||'')+'</div>'+
    '<div class="rvid"><video src="'+esc(RECREATE_BASE+r.clip)+'" autoplay muted loop playsinline preload="metadata"></video></div>'+
    (r.clipNote?'<div class="comment">'+esc(r.clipNote)+'</div>':'')+
    '<details class="fold"><summary>對照原片 ('+esc(x.channel)+' '+mss(x.start)+'–'+mss(x.end)+')</summary><div class="in">'+ytHTML(x,'r')+'</div></details>';
  if(r.status==='review'){
    h+='<div class="row"><input type="text" maxlength="300" data-rc="'+esc(r.pid)+'" placeholder="哪裡不像?一句話，可不寫" value="'+esc(S.draft['rc_'+r.pid]||'')+'"></div>'+
      '<div class="row"><button class="btn pri" data-act="rq" data-a="like" data-q="'+esc(r.pid)+'">像</button><button class="btn" data-act="rq" data-a="unlike" data-q="'+esc(r.pid)+'">不像，重做</button></div>';
  }else if(r.status==='approved'||r.status==='hold'){
    h+='<div class="row"><button class="btn pri" data-act="rq" data-a="merge" data-q="'+esc(r.pid)+'">收進指南</button>'+(r.status==='approved'?'<button class="btn" data-act="rq" data-a="hold" data-q="'+esc(r.pid)+'">先不要</button>':'')+'</div>';
  }
  return h+'</section>'}
function pendingCards(){return S.queue.filter(function(r){return (r.status==='review'||r.status==='approved')&&r.clip&&q(r.pid)})}

/* ---------- 今日 ---------- */
function renderToday(){
  var rc=pendingCards(),h=rc.length?'<div class="prog" style="margin-top:18px">重現版等你看 '+rc.length+' 段</div>'+rc.map(rCard).join(''):'';
  var qs=dayQs(S.today);
  if(!isWeekday(S.today)){app.innerHTML=h+'<div class="empty"><b>週末沒有作業</b>'+esc(nextLine())+'</div>';return}
  if(!qs.length){app.innerHTML=h+'<div class="empty"><b>今天沒有題目</b>'+esc(nextLine())+'</div>';return}
  qs.forEach(function(x,i){h+=qCard(x,i+1,qs.length,{next:i+1<qs.length?'next':'done'})});
  if(qs.every(function(x){return chosen(x.pid)}))h+=doneBox(qs);
  app.innerHTML=h;
  qs.forEach(function(x){if(!S.shownAt[x.pid])S.shownAt[x.pid]=Date.now()})}
function doneBox(qs){
  var sec=qs.reduce(function(s,x){return s+(ch(x.pid).seconds||0)},0),items=qs.map(function(x){return'「'+x.technique+'」→ '+CH[ch(x.pid).choice]});
  var waiting=S.queue.filter(function(r){return r.status==='queued'||r.status==='redo'}).length;
  return'<section class="donebox" id="donebox"><h2>今天完成 ✓ · '+Math.floor(sec/60)+' 分 '+(sec%60)+' 秒</h2><ul>'+items.map(function(t){return'<li>'+esc(t)+'</li>'}).join('')+'</ul>'+
    '<div class="comment">待重現佇列 '+waiting+' 段，'+esc(nextLine())+'</div><div class="row"><a class="btn" href="#taste" style="text-decoration:none;color:var(--text)">到我的審美看</a></div></section>'}

/* ---------- 歷史 ---------- */
function renderHistory(){
  var past=ready().filter(function(x){return x.date<=S.today}),days={};
  past.forEach(function(x){(days[x.date]=days[x.date]||[]).push(x)});
  var f=S.hist,h='<div class="filters"><h1>歷史</h1>'+[['all','全部'],['in','收進'],['skip','不適合']].map(function(b){return'<button class="fbtn'+(f===b[0]?' on':'')+'" data-act="hf" data-f="'+b[0]+'">'+b[1]+'</button>'}).join('')+'</div>';
  var any=false;
  Object.keys(days).sort().reverse().forEach(function(d){
    var list=days[d].sort(function(a,b){return a.slot-b.slot}).filter(function(x){var c=ch(x.pid);if(f==='in')return c&&(c.choice==='take'||c.choice==='part');if(f==='skip')return c&&c.choice==='skip';return true});
    if(!list.length)return;any=true;
    h+='<div class="day"><div class="d">'+md(d)+' '+WD[wd(d)]+'</div>';
    list.forEach(function(x){var c=ch(x.pid),a=c&&c.choice?CH[c.choice]:(d<S.today?'沒選':'還沒選'),cls=!c||!c.choice?'todo':c.choice==='skip'?'skip':'';
      h+='<button class="hrow" data-act="hopen" data-q="'+esc(x.pid)+'"><span class="num">'+'①②③④'.charAt(x.slot-1)+'</span><span>'+esc(x.technique)+'</span><span class="ans '+cls+'">→ '+esc(a)+'</span></button>';
      if(S.open['h_'+x.pid])h+='<div class="hdetail">'+qCard(x,x.slot,2,{noProg:true,ctx:'h'})+'</div>'});
    h+='</div>'});
  if(!any)h+='<div class="empty">'+(f==='all'?'還沒有紀錄，'+esc(nextLine()):'這個篩選沒有紀錄')+'</div>';
  h+='<div class="trial">11/18–11/20 的自製示範片 (左右二選一) 已停用，選過的紀錄都留在試算表</div>';
  app.innerHTML=h}

/* ---------- 我的審美 ---------- */
function renderTaste(){
  var took=[],skipped=[],pend=[];
  ready().forEach(function(x){var c=ch(x.pid);if(!c||!c.choice)return;if(c.choice==='skip')skipped.push(x);else took.push(x)});
  S.queue.forEach(function(r){if(r.status&&r.status!=='merged'&&r.status!=='cancelled'&&q(r.pid))pend.push(r)});
  var byDate=function(a,b){return a.date<b.date?1:a.date>b.date?-1:a.slot-b.slot};took.sort(byDate);skipped.sort(byDate);
  var merged=S.queue.filter(function(r){return r.status==='merged'}).length;
  var h='<div class="tasteh"><h1>我的審美</h1><div class="sum">已收進 '+took.length+' · 待重現 '+pend.length+' · 已入指南 '+merged+' · 不適合 '+skipped.length+'</div></div>';
  h+='<div class="sect"><h3>已收進</h3><p class="sub">你選「收進」或「只收一部分」的招式</p>'+(took.length?took.map(function(x){var c=ch(x.pid),r=qrow(x.pid),st=r?r.status:'';
      return'<div class="item"><div class="t">'+esc(x.technique)+'<span class="badge'+(st==='merged'?' good':'')+'">'+esc(CH[c.choice])+(st?' · '+esc(QS_TXT[st]||st):'')+'</span></div><div class="s">'+esc(x.channel)+' · '+md(x.date)+(c.uses&&c.uses.length?' · 用在:'+esc(c.uses.join('、')):'')+'</div>'+(c.comment?'<div class="s">你寫的:'+esc(c.comment)+'</div>':'')+'</div>'}).join(''):'<div class="empty" style="padding:16px">還沒有</div>')+'</div>';
  h+='<div class="sect"><h3>待重現</h3><p class="sub">教練用 Remotion 照拾作規格 (#2F8CFF 加灰、吉祥物只用小日) 做 8 秒重現版，你看過說像，再按收進指南才會寫進去</p>'+
    (pend.length?pend.map(function(r){var x=q(r.pid);if((r.status==='review'||r.status==='approved'||r.status==='hold')&&r.clip)return rCard(r);
      return'<div class="item"><div class="t">'+esc(x.technique)+'<span class="badge warn">'+esc(QS_TXT[r.status]||r.status)+'</span></div><div class="s">'+esc(QS_SUB[r.status]||'')+(r.verdictComment?' · 你說:'+esc(r.verdictComment):'')+'</div></div>'}).join(''):'<div class="empty" style="padding:16px">沒有</div>')+'</div>';
  h+='<div class="sect"><h3>不適合</h3><p class="sub">你選「不適合我的片」的招式</p>'+(skipped.length?skipped.map(function(x){var c=ch(x.pid);
      return'<div class="item"><div class="t">'+esc(x.technique)+'</div><div class="s">'+esc(x.channel)+' · '+md(x.date)+(c.comment?' · 你寫的:'+esc(c.comment):'')+'</div></div>'}).join(''):'<div class="empty" style="padding:16px">還沒有</div>')+'</div>';
  app.innerHTML=h}

/* ---------- 互動 ---------- */
function rerender(){route(true)}
document.addEventListener('change',function(e){var t=e.target;
  if(t.getAttribute&&t.getAttribute('data-use')){var pid=t.getAttribute('data-use'),d=S.draft[pid];if(!d)return;var v=t.value,i=d.uses.indexOf(v);
    if(t.checked&&i<0)d.uses.push(v);if(!t.checked&&i>=0)d.uses.splice(i,1);t.parentNode.classList.toggle('on',t.checked)}});
document.addEventListener('input',function(e){var t=e.target;
  if(t.getAttribute&&t.getAttribute('data-cm')){var d=S.draft[t.getAttribute('data-cm')];if(d)d.comment=t.value}
  if(t.getAttribute&&t.getAttribute('data-rc'))S.draft['rc_'+t.getAttribute('data-rc')]=t.value});
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('[data-act]');if(!b)return;
  var act=b.getAttribute('data-act'),pid=b.getAttribute('data-q');
  if(act==='choose'){var c=b.getAttribute('data-c'),sec=Math.min(600,Math.round((Date.now()-(S.shownAt[pid]||Date.now()))/1000));
    S.busy[pid]=true;[].forEach.call(document.querySelectorAll('#q-'+pid+' .choices button'),function(x){x.disabled=true});
    call('saveProChoice',S.key,{pid:pid,choice:c,seconds:sec}).then(function(r){S.busy[pid]=false;S.choices[pid]=r.choice;if(r.queue)setQueue(r.queue);delete S.draft[pid];S.open['re_'+pid]=false;rerender();toast('記下了:'+CH[c])})
      .catch(function(err){S.busy[pid]=false;rerender();toast('沒存到:'+(err.message||err))});return}
  if(act==='saveuse'){var d=S.draft[pid]||{uses:[],comment:''};b.disabled=true;
    call('saveProChoice',S.key,{pid:pid,uses:d.uses,comment:d.comment}).then(function(r){S.choices[pid]=r.choice;delete S.draft[pid];rerender();toast('存好了')}).catch(function(err){b.disabled=false;toast('沒存到:'+(err.message||err))});return}
  if(act==='re'){S.open['re_'+pid]=true;S.shownAt[pid]=Date.now();rerender();return}
  if(act==='cancelre'){S.open['re_'+pid]=false;rerender();return}
  if(act==='replay'){var x=q(pid),f=document.querySelector('iframe[data-yt="'+b.getAttribute('data-ctx')+pid+'"]');if(x&&f)f.src=embedURL(x,true);return}
  if(act==='next'){var qs=dayQs(S.today),i=qs.map(function(y){return y.pid}).indexOf(pid),nx=qs[i+1],el=nx?document.getElementById('q-'+nx.pid):document.getElementById('donebox');
    if(el){el.scrollIntoView({behavior:'smooth',block:'start'});if(nx)S.shownAt[nx.pid]=Date.now()}return}
  if(act==='hf'){S.hist=b.getAttribute('data-f');rerender();return}
  if(act==='hopen'){S.open['h_'+pid]=!S.open['h_'+pid];if(S.open['h_'+pid])S.shownAt[pid]=Date.now();rerender();return}
  if(act==='rq'){var a=b.getAttribute('data-a'),p={pid:pid,action:a};if(a==='like'||a==='unlike')p.comment=S.draft['rc_'+pid]||'';b.disabled=true;
    call('recreateAction',S.key,p).then(function(r){setQueue(r);rerender();toast(a==='like'?'記下了:像':a==='unlike'?'記下了:不像，教練會重做':a==='merge'?'收進了，教練會備份後寫進指南':'先不收')})
      .catch(function(err){b.disabled=false;toast('沒存到:'+(err.message||err))});return}
});

/* ---------- 路由 ---------- */
function go(h,push){h=h||'today';if(push===false&&h===S.hash&&S.routed)return;S.hash=h;
  if(push!==false&&location.hash.slice(1)!==h)try{history.pushState(null,'','#'+h)}catch(e){location.hash=h}
  S.routed=true;route()}
function onNav(){if(S.loaded)go(decodeURIComponent(location.hash.slice(1))||'today',false)}
window.addEventListener('popstate',onNav);window.addEventListener('hashchange',onNav);
function route(keep){
  var y=window.scrollY;S.view=['today','history','taste'].indexOf(S.hash)>=0?S.hash:'today';
  [].forEach.call(document.querySelectorAll('nav.tabs a'),function(a){a.classList.toggle('on',a.getAttribute('data-v')===S.view)});
  if(S.view==='today')renderToday();else if(S.view==='history')renderHistory();else renderTaste();
  [].forEach.call(document.querySelectorAll('video'),function(v){v.muted=true;var p=v.play&&v.play();if(p&&p.catch)p.catch(function(){})});
  if(keep)window.scrollTo(0,y);else window.scrollTo(0,0)}
function load(){
  var qs=new URLSearchParams(location.search),ov=qs.get('today');
  return call('getData',S.key).then(function(d){
    S.questions=d.questions||[];S.choices=d.choices||{};S.queue=d.queue||[];
    S.hash=decodeURIComponent(location.hash.slice(1))||S.hash;S.today=(ov&&/^\d{4}-\d{2}-\d{2}$/.test(ov))?ov:(d.today||taipeiToday());S.loaded=true;S.routed=true;route()})}
window.__aes={S:S,route:route};
start(load,function(err){app.innerHTML='<div class="empty"><b>讀不到資料</b>'+esc(err&&err.message||err)+'</div>'},S);
})();
</script>
