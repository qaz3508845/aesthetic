<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>拾作審美練習</title>
<style>
:root{--bg:#0b0d10;--surface:#12161b;--surface2:#171c22;--line:#222a33;--line2:#2c3540;--text:#e7eaee;--muted:#8b95a1;--dim:#5f6873;
  --accent:#2f8cff;--accent-soft:rgba(47,140,255,.14);--good:#3ccf91;--warn:#f2b84b;--bad:#ef6b6b;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:0 14px 90px}
header.top{position:sticky;top:0;z-index:20;background:rgba(11,13,16,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topin{max-width:860px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:12px}
.brand{font-weight:700;white-space:nowrap}
nav.tabs{display:flex;gap:2px;margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
nav.tabs a{color:var(--muted);padding:5px 13px;border-radius:999px;font-size:14px;white-space:nowrap}
nav.tabs a.on{background:var(--surface2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
@media(max-width:520px){.brand{font-size:14px}nav.tabs a{padding:5px 10px;font-size:13px}}
.prog{color:var(--muted);font-size:13px;margin:18px 0 6px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px;scroll-margin-top:70px}
.qcard.done{padding:14px 16px}
.focusline{font-size:13px;color:var(--muted);margin-bottom:6px}
.decide{font-size:20px;font-weight:700;line-height:1.45;margin:2px 0 12px}
@media(max-width:520px){.decide{font-size:18px}}
.vid{position:relative;border-radius:12px;overflow:hidden;background:#05080f;aspect-ratio:1920/584}
.vid video,.vid img{display:block;width:100%;height:100%;object-fit:contain}
.vid .mark{position:absolute;top:8px;font-size:13px;font-weight:700;background:rgba(5,8,15,.82);border:1px solid var(--line2);border-radius:999px;padding:2px 10px}
.vid .mark.left{left:8px}.vid .mark.right{right:8px}
.vid .shade{position:absolute;top:0;bottom:0;width:50%;background:rgba(5,8,15,.55)}
.vid .shade.left{left:0}.vid .shade.right{right:0}
.qcard.done .vid{max-width:420px}
.diff{font-size:13px;color:var(--muted);margin-top:8px;display:flex;gap:10px;flex-wrap:wrap}
.diff .zoom{margin-left:auto;color:var(--dim);background:none;border:0;padding:0;font-size:13px}
.choices{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}
.choices button{background:var(--surface2);border:1px solid var(--line2);border-radius:12px;padding:14px 6px;font-weight:700;font-size:16px}
.choices button.none{font-weight:500;font-size:14px;color:var(--muted)}
.choices button.on{border-color:var(--text);box-shadow:0 0 0 1px var(--text)}
.choices button:active{transform:scale(.98)}
.choices button[disabled]{opacity:.5}
.noted{margin-top:12px;font-size:15px}
.noted b{font-weight:700}
.noted .n{color:var(--muted);font-size:13px;margin-left:6px}
details.fold{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
details.fold summary{cursor:pointer;color:var(--muted);font-size:14px;list-style:none}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary:before{content:"▸ ";color:var(--dim)}
details.fold[open] summary:before{content:"▾ "}
details.fold .in{font-size:14px;margin-top:6px;color:var(--text)}
details.fold ul{margin:4px 0 0;padding-left:18px}
.row{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.btn{background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:8px 14px;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.link{background:none;border:0;color:var(--muted);padding:8px 4px}
.btn[disabled]{opacity:.5}
.right{margin-left:auto}
input[type=text]{width:100%;background:#0e1115;border:1px solid var(--line2);border-radius:10px;color:var(--text);font:inherit;padding:9px 12px}
input[type=text]:focus{outline:none;border-color:var(--accent)}
.comment{font-size:13px;color:var(--muted);margin-top:8px}
.donebox{background:linear-gradient(180deg,rgba(60,207,145,.08),transparent);border:1px solid rgba(60,207,145,.3);border-radius:var(--r);padding:18px;margin-top:16px}
.donebox h2{margin:0 0 6px;font-size:19px}
.donebox ul{margin:6px 0 0;padding-left:18px}
.gcard{background:var(--surface);border:1px solid var(--warn);border-radius:var(--r);padding:16px;margin-top:16px}
.gcard h2{font-size:16px;margin:0 0 10px;line-height:1.5}
.gcard label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.gcard label input{margin-top:4px;width:18px;height:18px;accent-color:var(--good)}
.gcard .sec{color:var(--muted);font-size:12px;display:block}
.empty{color:var(--muted);text-align:center;padding:48px 10px}
.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
/* 歷史 */
.filters{display:flex;gap:8px;margin:18px 0 8px;flex-wrap:wrap;align-items:center}
.filters h1{font-size:20px;margin:0 auto 0 0}
.fbtn{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
.fbtn.on{border-color:var(--text);color:var(--text)}
.day{border-top:1px solid var(--line);padding:10px 0}
.day .d{color:var(--muted);font-size:13px;margin-bottom:4px}
.hrow{display:flex;gap:10px;align-items:baseline;width:100%;background:none;border:0;text-align:left;padding:6px 0;font-size:15px}
.hrow .num{color:var(--dim);font-size:13px;min-width:16px}
.hrow .ans{margin-left:auto;white-space:nowrap;font-weight:700}
.hrow .ans.none{color:var(--muted);font-weight:500}
.hrow .ans.todo{color:var(--dim);font-weight:500}
.hdetail{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin:4px 0 8px}
.trial{color:var(--dim);font-size:13px;border-top:1px solid var(--line);padding:12px 0}
/* 我的審美 */
.tasteh{margin:18px 0 4px}
.tasteh h1{font-size:20px;margin:0}
.tasteh .sum{color:var(--muted);font-size:14px}
.sect{margin-top:18px}
.sect h3{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 6px;letter-spacing:.03em}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.rule summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:baseline;padding:11px 14px}
.rule summary::-webkit-details-marker{display:none}
.rule .ic{width:16px;text-align:center}
.rule .ic.in{color:var(--good)}.rule .ic.sug{color:var(--warn)}.rule .ic.obs{color:var(--muted)}.rule .ic.out{color:var(--dim)}
.rule .tx{flex:1}
.rule .vt{color:var(--muted);font-size:13px;white-space:nowrap}
.rule .st{font-size:12px;white-space:nowrap;padding:1px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--muted)}
.rule .st.in{color:var(--good);border-color:rgba(60,207,145,.45)}.rule .st.sug{color:var(--warn);border-color:rgba(242,184,75,.45)}
.rule .body{padding:0 14px 12px 40px;font-size:14px;color:var(--muted)}
@media(max-width:520px){.rule summary{flex-wrap:wrap}.rule .tx{flex-basis:calc(100% - 30px)}.rule .vt{margin-left:26px}}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1b222b;border:1px solid var(--line2);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
</style>
</head>
<body>
<header class="top"><div class="topin">
  <div class="brand">拾作審美練習</div>
  <nav class="tabs">
    <a href="#today" data-v="today">今日</a>
    <a href="#history" data-v="history">歷史</a>
    <a href="#taste" data-v="taste">我的審美</a>
  </nav>
</div></header>
<main class="wrap" id="app"><div class="loading">載入中…</div></main>
<div class="toast" id="toast"></div>
<script>
/* v5 GitHub Pages 版:資料在 Google 試算表，透過 Apps Script 網頁應用程式的 JSON API 讀寫 */
var API_URL='https://script.google.com/macros/s/AKfycby3mo0TCoLm_VhK-3bvIti7Mp6b269avp-EuYtMrmkJiGz_UuJ2240UOUsDVA3Rq7a9_g/exec';
var CLIP_BASE='clips/';
function unwrap(j){if(!j||typeof j!=='object')throw new Error('伺服器回應格式不對');if(!j.ok)throw new Error(j.error||'伺服器錯誤');return j.data}
function jsonp(url){return new Promise(function(ok,no){
  var cb='__aes_cb'+Date.now()+Math.floor(Math.random()*1e4),sc=document.createElement('script'),t=setTimeout(function(){done();no(new Error('連線逾時'))},20000);
  function done(){clearTimeout(t);try{delete window[cb]}catch(e){window[cb]=undefined}if(sc.parentNode)sc.parentNode.removeChild(sc)}
  window[cb]=function(j){done();try{ok(unwrap(j))}catch(e){no(e)}};
  sc.onerror=function(){done();no(new Error('連不上伺服器'))};
  sc.src=url+'&callback='+cb;document.head.appendChild(sc)})}
function apiGet(action,k){
  var url=API_URL+'?action='+encodeURIComponent(action)+'&k='+encodeURIComponent(k||'')+'&_='+Date.now();
  return fetch(url,{method:'GET',cache:'no-store',redirect:'follow',credentials:'omit'})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
    .then(function(j){return{j:j}},function(){return jsonp(url).then(function(d){return{d:d}})})
    .then(function(x){return 'd' in x?x.d:unwrap(x.j)})}
function apiPost(action,k,payload){
  return fetch(API_URL,{method:'POST',redirect:'follow',credentials:'omit',
    headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:action,k:k||'',payload:payload})})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(unwrap)}
function call(fn,k,payload){
  if(fn==='getData')return apiGet('getData5',k);
  if(fn==='saveChoice'||fn==='acceptRule')return apiPost(fn,k,payload);
  return Promise.reject(new Error('未知的動作 '+fn))}
var KEY_LS='aesthetic_access_key';
function lsGet(){try{return localStorage.getItem(KEY_LS)||''}catch(e){return''}}
function lsSet(v){try{if(v)localStorage.setItem(KEY_LS,v);else localStorage.removeItem(KEY_LS)}catch(e){}}
function start(load,fail,S){
  var qk=new URLSearchParams(location.search).get('k')||'';
  if(qk)lsSet(qk);
  S.key=qk||lsGet();
  if(!S.key){document.getElementById('app').innerHTML='<div class="empty"><b>這台裝置還沒有金鑰</b>請用審美教練給你、網址後面帶 ?k= 的連結開一次，之後就會記住</div>';return}
  load().catch(function(err){var m=String(err&&err.message||err);if(/金鑰/.test(m)&&!qk)lsSet('');fail(err)})}

(function(){
var S={questions:[],rules:[],choices:{},guide:[],today:'',key:'',hash:'today',hist:'all',open:{},shownAt:{},comment:{},routed:false,loaded:false};
var WD='日一二三四五六';
var app=document.getElementById('app');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function lines(s){var a=String(s||'').split(/\n+/).map(function(x){return x.trim()}).filter(String);if(!a.length)return'';if(a.length===1)return'<div>'+esc(a[0])+'</div>';return'<ul>'+a.map(function(x){return'<li>'+esc(x)+'</li>'}).join('')+'</ul>'}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show')},1800)}
function dobj(s){var p=String(s).split('-');return new Date(Date.UTC(+p[0],+p[1]-1,+p[2]))}
function dstr(d){return d.toISOString().slice(0,10)}
function wd(s){return dobj(s).getUTCDay()}
function md(s){var p=String(s).split('-');return (+p[1])+'/'+(+p[2])}
function addDays(s,n){var d=dobj(s);d.setUTCDate(d.getUTCDate()+n);return dstr(d)}
function monday(s){var w=wd(s);return addDays(s,-((w+6)%7))}
function isWeekday(s){var w=wd(s);return w>=1&&w<=5}
function taipeiToday(){return dstr(new Date(Date.now()+8*3600*1000))}
function rule(rid){for(var i=0;i<S.rules.length;i++)if(S.rules[i].rid===rid)return S.rules[i];return null}
function q(qid){for(var i=0;i<S.questions.length;i++)if(S.questions[i].qid===qid)return S.questions[i];return null}
function ready(){return S.questions.filter(function(x){return !x.status||x.status==='ready'})}
function dayQs(d){return ready().filter(function(x){return x.date===d}).sort(function(a,b){return a.slot-b.slot})}
function ch(qid){return S.choices[qid]||null}
function chosen(qid){var c=ch(qid);return !!(c&&c.choice)}
function sideText(c){return c==='left'?'左邊':c==='right'?'右邊':'都不像我的片'}

/* ---------- 票數與規則狀態 (只算 date < before 的選擇，before 省略=全部) ---------- */
function tally(before){
  var v={};
  Object.keys(S.choices).forEach(function(k){var c=S.choices[k];if(!c.rule||!c.choice||c.choice==='none')return;if(before&&!(c.date<before))return;v[c.rule]=(v[c.rule]||0)+1});
  return v}
function decisions(){var d={};S.guide.slice().sort(function(a,b){return a.at<b.at?-1:1}).forEach(function(g){d[g.rid]=g.action});return d}
function status(r,v,dec){
  var a=dec[r.rid];if(a==='accept')return'in';if(a==='reject')return'out';
  var n=v[r.rid]||0,x=v[r.opposite]||0;
  if(n>=2&&x===0)return'sug';if(n>0)return'obs';if(x>0)return'not';return'';}
var STXT={in:'已入指南',sug:'建議採用',obs:'觀察中',not:'不合我',out:'不要了','':'還沒投'};
var SICO={in:'●',sug:'●',obs:'◐',not:'○',out:'○','':'·'};
function cardRules(){
  if(wd(S.today)!==1)return[];
  var v=tally(S.today),dec=decisions();
  return S.rules.filter(function(r){return (!dec[r.rid]||dec[r.rid]==="restore")&&status(r,v,{})==='sug'}).sort(function(a,b){return (v[b.rid]||0)-(v[a.rid]||0)}).slice(0,3)
    .map(function(r){return{r:r,n:v[r.rid]||0,x:v[r.opposite]||0}})}

/* ---------- 今日 ---------- */
function weekDone(){var m=monday(S.today),n=0;for(var i=0;i<5;i++){var d=addDays(m,i),qs=dayQs(d);if(qs.length&&qs.every(function(x){return chosen(x.qid)}))n++}return n}
function progLine(qs,idx){return md(S.today)+' ('+WD[wd(S.today)]+') · 第 '+idx+' 題/'+qs.length+' · 本週 '+weekDone()+'/5 天'}
function decideText(x){return'你的下一支片，'+x.prompt+'要像左邊還是右邊?'}
function videoHTML(x,c){
  var src=CLIP_BASE+encodeURIComponent(x.clip),poster=CLIP_BASE+encodeURIComponent(x.clip.replace(/\.mp4$/,'.jpg'));
  var h='<div class="vid"><video src="'+esc(src)+'" poster="'+esc(poster)+'" autoplay muted loop playsinline preload="auto" disablepictureinpicture></video>';
  if(!c||c.choice==='none')h+='<span class="mark left">左</span><span class="mark right">右</span>';
  if(c&&c.choice==='left')h+='<div class="shade right"></div><span class="mark left">✓ 左邊</span>';
  if(c&&c.choice==='right')h+='<div class="shade left"></div><span class="mark right">✓ 右邊</span>';
  return h+'</div>'}
function notedLine(x,c){
  if(c.choice==='none')return'<div class="noted">記下了:這題兩邊都不像你的片<span class="n">教練會換個方向出題</span></div>';
  var r=rule(c.rule),v=tally();
  return'<div class="noted">記下了:你偏好<b>「'+esc(r?r.text:c.rule)+'」</b><span class="n">第 '+(v[c.rule]||1)+' 票</span></div>'}
function folds(x){
  var src=x.source?'<div>'+esc(x.source)+'</div>':'';
  if(x.sourceUrl)src+='<div style="margin-top:4px"><a href="'+esc(x.sourceUrl)+'" target="_blank" rel="noopener">打開出處 (YouTube，可不看)</a></div>';
  return'<details class="fold"><summary>為什麼差這一處</summary><div class="in">'+lines(x.principle)+(x.params?'<div style="margin-top:6px;color:var(--muted)">'+lines(x.params)+'</div>':'')+
    '<div style="margin-top:6px;color:var(--muted)">左邊:'+esc(x.leftDesc)+'<br>右邊:'+esc(x.rightDesc)+'</div></div></details>'+
    '<details class="fold"><summary>這題怎麼來的</summary><div class="in">'+(src||'<span style="color:var(--muted)">教練自己出的題</span>')+'</div></details>'}
function qCard(x,idx,qs,opts){
  opts=opts||{};var c=ch(x.qid),done=!!(c&&c.choice)&&!S.open['re_'+x.qid];
  var h='<section class="qcard'+(done?' done':'')+'" id="q-'+esc(x.qid)+'">';
  if(!opts.noProg)h+='<div class="prog" style="margin:0 0 6px">'+esc(progLine(qs,idx))+'</div>';
  h+='<div class="focusline">'+esc(x.focus)+'</div><div class="decide">'+esc(decideText(x))+'</div>'+videoHTML(x,done?c:null);
  if(!done){
    h+='<div class="diff"><span>▶ 無聲循環 8 秒</span><span>'+esc(x.diff)+'</span><button class="zoom" data-act="zoom" data-q="'+esc(x.qid)+'">放大看</button></div>'+
      '<div class="choices">'+['left','right','none'].map(function(s){return'<button class="'+(s==='none'?'none':'')+(c&&c.choice===s?' on':'')+'" data-act="choose" data-q="'+esc(x.qid)+'" data-c="'+s+'">'+sideText(s)+'</button>'}).join('')+'</div>';
    if(S.open['re_'+x.qid])h+='<div class="row"><button class="btn link" data-act="cancelre" data-q="'+esc(x.qid)+'">不改了</button></div>';
  }else{
    h+=notedLine(x,c)+(c.comment?'<div class="comment">你留的:'+esc(c.comment)+'</div>':'')+folds(x);
    if(S.open['cm_'+x.qid])h+='<div class="row"><input type="text" maxlength="300" data-cm="'+esc(x.qid)+'" placeholder="想補一句就寫，不寫也行" value="'+esc(S.comment[x.qid]!=null?S.comment[x.qid]:c.comment||'')+'"><button class="btn" data-act="savecm" data-q="'+esc(x.qid)+'">存</button></div>';
    h+='<div class="row">'+(S.open['cm_'+x.qid]?'':'<button class="btn link" data-act="cm" data-q="'+esc(x.qid)+'">留一句</button>')+
      '<button class="btn right" data-act="re" data-q="'+esc(x.qid)+'">改選</button>'+
      (opts.next?'<button class="btn pri" data-act="next" data-q="'+esc(x.qid)+'">'+(opts.next==='done'?'完成 →':'下一題 →')+'</button>':'')+'</div>';
  }
  return h+'</section>'}
function guideCardHTML(){
  var list=cardRules();if(!list.length)return'';
  return'<section class="gcard" id="gcard"><h2>上週有 '+list.length+' 條規則達到門檻，收進 editing_style_guide.md?</h2>'+
    list.map(function(o){return'<label><input type="checkbox" checked data-gr="'+esc(o.r.rid)+'"><span>'+esc(o.r.text)+'<span class="sec">→ '+esc(o.r.section)+' · '+o.n+' 票 · '+o.x+' 反</span></span></label>'}).join('')+
    '<div class="row"><button class="btn pri" data-act="guide">全部收進</button><span style="color:var(--muted);font-size:13px">點勾取消就不收進</span></div></section>'}
function nextReadyDate(){var d=ready().map(function(x){return x.date}).filter(function(d){return d>S.today}).sort();return d[0]||''}
function renderToday(){
  var h=guideCardHTML(),qs=dayQs(S.today);
  if(!isWeekday(S.today)){app.innerHTML=h+'<div class="empty"><b>週末沒有作業</b>下週一見</div>';return}
  if(!qs.length){var n=nextReadyDate();app.innerHTML=h+'<div class="empty"><b>今天沒有題目</b>'+(n?'下一份在 '+md(n)+' ('+WD[wd(n)]+')':'教練在補貨')+'</div>';return}
  var allDone=qs.every(function(x){return chosen(x.qid)});
  qs.forEach(function(x,i){h+=qCard(x,i+1,qs,{next:i+1<qs.length?'next':'done'})});
  if(allDone)h+=doneBox(qs);
  app.innerHTML=h;
  qs.forEach(function(x){if(!S.shownAt[x.qid])S.shownAt[x.qid]=Date.now()})}
function doneBox(qs){
  var sec=qs.reduce(function(s,x){return s+(ch(x.qid).seconds||0)},0),v=tally(),items=[];
  qs.forEach(function(x){var c=ch(x.qid);if(c.choice==='none'){items.push('「'+x.diff.replace(/^差別:/,'')+'」兩邊都不像你的片');return}
    var r=rule(c.rule),n=v[c.rule]||0,ag=r?v[r.opposite]||0:0;
    items.push('「'+(r?r.text:c.rule)+'」累積到第 '+n+' 票'+(n>=2&&ag===0?'，下週一問你要不要收進指南':''))});
  return'<section class="donebox" id="donebox"><h2>今天完成 ✓ · '+Math.floor(sec/60)+' 分 '+(sec%60)+' 秒</h2><ul>'+items.map(function(t){return'<li>'+esc(t)+'</li>'}).join('')+'</ul>'+
    '<div class="row"><a class="btn" href="#taste">到我的審美看</a></div></section>'}

/* ---------- 歷史 ---------- */
function renderHistory(){
  var past=ready().filter(function(x){return x.date<=S.today}),days={};
  past.forEach(function(x){(days[x.date]=days[x.date]||[]).push(x)});
  var f=S.hist,h='<div class="filters"><h1>歷史</h1>'+[['all','全部'],['lr','左/右'],['none','都不像']].map(function(b){return'<button class="fbtn'+(f===b[0]?' on':'')+'" data-act="hf" data-f="'+b[0]+'">'+b[1]+'</button>'}).join('')+'</div>';
  var keys=Object.keys(days).sort().reverse(),any=false;
  keys.forEach(function(d){
    var list=days[d].sort(function(a,b){return a.slot-b.slot}).filter(function(x){var c=ch(x.qid);if(f==='lr')return c&&(c.choice==='left'||c.choice==='right');if(f==='none')return c&&c.choice==='none';return true});
    if(!list.length)return;any=true;
    h+='<div class="day"><div class="d">'+md(d)+' '+WD[wd(d)]+'</div>';
    list.forEach(function(x){var c=ch(x.qid),a=c&&c.choice?sideText(c.choice):(d<S.today?'沒選':'還沒選'),cls=!c||!c.choice?'todo':c.choice==='none'?'none':'';
      h+='<button class="hrow" data-act="hopen" data-q="'+esc(x.qid)+'"><span class="num">'+'①②③④'.charAt(x.slot-1)+'</span><span>'+esc(x.diff.replace(/^差別:/,''))+'</span><span class="ans '+cls+'">→ '+esc(a)+'</span></button>';
      if(S.open['h_'+x.qid])h+='<div class="hdetail">'+qCard(x,x.slot,dayQs(x.date),{noProg:true})+'</div>'});
    h+='</div>'});
  if(!any)h+='<div class="empty">'+(f==='all'?'還沒有紀錄，第一份在 '+md(nextReadyDate()||S.today):'這個篩選沒有紀錄')+'</div>';
  h+='<div class="trial">11/18 三 試版 · 3 題已改寫為 11/19、11/20、11/23 題目的出處，不計分</div>';
  app.innerHTML=h}

/* ---------- 我的審美 ---------- */
function renderTaste(){
  var v=tally(),dec=decisions(),asked={};
  ready().forEach(function(x){if(x.date<=S.today){(asked[x.leftRule]=asked[x.leftRule]||[]).push(x);(asked[x.rightRule]=asked[x.rightRule]||[]).push(x)}});
  var rs=S.rules.filter(function(r){return status(r,v,dec)!==''});
  var cnt={in:0,obs:0,not:0};rs.forEach(function(r){var s=status(r,v,dec);if(s==='in')cnt.in++;else if(s==='obs'||s==='sug')cnt.obs++;else if(s==='not'||s==='out')cnt.not++});
  var h='<div class="tasteh"><h1>我的審美</h1><div class="sum">已入指南 '+cnt.in+' · 觀察中 '+cnt.obs+' · 不合我 '+cnt.not+'</div></div>';
  if(!rs.length){app.innerHTML=h+'<div class="empty">選過幾題之後，這裡會列出你偏好的規則</div>';return}
  var secs={};rs.forEach(function(r){(secs[r.section]=secs[r.section]||[]).push(r)});
  Object.keys(secs).sort().forEach(function(sec){
    h+='<div class="sect"><h3>'+esc(sec)+'</h3>';
    secs[sec].sort(function(a,b){return (v[b.rid]||0)-(v[a.rid]||0)||(a.rid<b.rid?-1:1)}).forEach(function(r){
      var s=status(r,v,dec),src=(asked[r.rid]||[]).map(function(x){return md(x.date)+' 第 '+x.slot+' 題 ('+(x.leftRule===r.rid?'左':'右')+')'});
      var ic=s==='in'?'in':s==='sug'?'sug':s==='obs'?'obs':'out';
      h+='<details class="rule" data-rid="'+esc(r.rid)+'"'+(S.open['r_'+r.rid]?' open':'')+'><summary><span class="ic '+ic+'">'+SICO[s]+'</span><span class="tx">'+esc(r.text)+'</span><span class="vt">'+(v[r.rid]||0)+' 票 · '+(v[r.opposite]||0)+' 反</span><span class="st '+(s==='in'?'in':s==='sug'?'sug':'')+'">'+(s==='in'?'✓ ':'')+STXT[s]+'</span></summary>'+
        '<div class="body">'+(src.length?'出自:'+esc(src.join('、')):'')+(r.note?'<div>'+esc(r.note)+'</div>':'')+
        '<div class="row">'+(s==='out'?'<button class="btn" data-act="rule" data-r="'+esc(r.rid)+'" data-a="restore">恢復這條</button>':'<button class="btn" data-act="rule" data-r="'+esc(r.rid)+'" data-a="reject">這條下次不要</button>')+'</div></div></details>'});
    h+='</div>'});
  app.innerHTML=h}

/* ---------- 動作 ---------- */
function choose(qid,c,btn){
  var x=q(qid);if(!x)return;var first=!chosen(qid);
  var secs=Math.round((Date.now()-(S.shownAt[qid]||Date.now()))/1000);
  [].forEach.call(document.querySelectorAll('[data-act="choose"][data-q="'+qid+'"]'),function(b){b.disabled=true});
  call('saveChoice',S.key,{qid:qid,choice:c,seconds:Math.min(secs,600)}).then(function(r){
    S.choices[qid]=r;delete S.open['re_'+qid];route(true);
    if(first&&S.view==='today'){var qs=dayQs(S.today),i=qs.map(function(y){return y.qid}).indexOf(qid);clearTimeout(choose._t);
      choose._t=setTimeout(function(){var nx=qs[i+1];var el=nx&&!chosen(nx.qid)?document.getElementById('q-'+nx.qid):document.getElementById('donebox');if(el){el.scrollIntoView({behavior:'smooth',block:'start'});if(nx)S.shownAt[nx.qid]=Date.now()}},2000)}
  }).catch(function(e){toast('沒存到:'+(e.message||e));[].forEach.call(document.querySelectorAll('[data-act="choose"][data-q="'+qid+'"]'),function(b){b.disabled=false})})}
document.addEventListener('toggle',function(e){var r=e.target.getAttribute&&e.target.getAttribute('data-rid');if(r)S.open['r_'+r]=e.target.open},true);
document.addEventListener('input',function(e){var k=e.target.getAttribute&&e.target.getAttribute('data-cm');if(k)S.comment[k]=e.target.value});
document.addEventListener('click',function(e){
  var a=e.target.closest('a[href^="#"]');if(a){e.preventDefault();go(a.getAttribute('href').slice(1));return}
  var b=e.target.closest('[data-act]');if(!b)return;
  var act=b.getAttribute('data-act'),qid=b.getAttribute('data-q');
  if(act==='choose')return choose(qid,b.getAttribute('data-c'),b);
  if(act==='re'){S.open['re_'+qid]=true;S.shownAt[qid]=Date.now();route(true);return}
  if(act==='cancelre'){delete S.open['re_'+qid];route(true);return}
  if(act==='cm'){S.open['cm_'+qid]=true;route(true);var i=document.querySelector('[data-cm="'+qid+'"]');if(i)i.focus();return}
  if(act==='savecm'){b.disabled=true;var val=(S.comment[qid]!=null?S.comment[qid]:'').trim();
    call('saveChoice',S.key,{qid:qid,comment:val}).then(function(r){S.choices[qid]=r;delete S.open['cm_'+qid];delete S.comment[qid];route(true);toast('存好了')}).catch(function(e){b.disabled=false;toast('沒存到:'+(e.message||e))});return}
  if(act==='next'){var qs=dayQs(S.today),i=qs.map(function(y){return y.qid}).indexOf(qid),nx=qs[i+1],el=nx?document.getElementById('q-'+nx.qid):document.getElementById('donebox');
    if(el){el.scrollIntoView({behavior:'smooth',block:'start'});if(nx)S.shownAt[nx.qid]=Date.now()}return}
  if(act==='zoom'){var v=document.querySelector('#q-'+qid+' video');if(v){if(v.requestFullscreen)v.requestFullscreen().catch(function(){});else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen()}return}
  if(act==='hf'){S.hist=b.getAttribute('data-f');route(true);return}
  if(act==='hopen'){S.open['h_'+qid]=!S.open['h_'+qid];if(S.open['h_'+qid]&&!S.shownAt[qid])S.shownAt[qid]=Date.now();route(true);return}
  if(act==='guide'){b.disabled=true;var boxes=[].slice.call(document.querySelectorAll('[data-gr]')),wk=S.today;
    Promise.all(boxes.map(function(x){return call('acceptRule',S.key,{rid:x.getAttribute('data-gr'),action:x.checked?'accept':'reject',week:wk})}))
      .then(function(rs){rs.forEach(function(r){S.guide.push(r)});var n=rs.filter(function(r){return r.action==='accept'}).length;route(true);toast(n?'收進 '+n+' 條，教練會寫進風格指南':'這週都不收')})
      .catch(function(e){b.disabled=false;toast('沒存到:'+(e.message||e))});return}
  if(act==='rule'){b.disabled=true;call('acceptRule',S.key,{rid:b.getAttribute('data-r'),action:b.getAttribute('data-a'),week:''}).then(function(r){S.guide.push(r);route(true);toast(r.action==='reject'?'之後不會再用這條':'恢復了')}).catch(function(e){b.disabled=false;toast('沒存到:'+(e.message||e))});return}
});

/* ---------- 路由 ---------- */
function go(h,push){h=h||'today';if(push===false&&h===S.hash&&S.routed)return;S.hash=h;
  if(push!==false&&location.hash.slice(1)!==h)try{history.pushState(null,'','#'+h)}catch(e){location.hash=h}
  S.routed=true;route()}
function onNav(){if(S.loaded)go(decodeURIComponent(location.hash.slice(1))||'today',false)}
window.addEventListener('popstate',onNav);window.addEventListener('hashchange',onNav);
function route(keep){
  var y=window.scrollY;S.view=['today','history','taste'].indexOf(S.hash)>=0?S.hash:'today';
  [].forEach.call(document.querySelectorAll('nav.tabs a'),function(a){a.classList.toggle('on',a.getAttribute('data-v')===S.view)});
  if(S.view==='today')renderToday();else if(S.view==='history')renderHistory();else renderTaste();
  [].forEach.call(document.querySelectorAll('video'),function(v){v.muted=true;var p=v.play&&v.play();if(p&&p.catch)p.catch(function(){})});
  if(keep)window.scrollTo(0,y);else window.scrollTo(0,0)}
function load(){
  var qs=new URLSearchParams(location.search),ov=qs.get('today');
  return call('getData',S.key).then(function(d){
    S.questions=d.questions||[];S.rules=d.rules||[];S.choices=d.choices||{};S.guide=d.guide||[];
    S.hash=decodeURIComponent(location.hash.slice(1))||S.hash;S.today=(ov&&/^\d{4}-\d{2}-\d{2}$/.test(ov))?ov:(d.today||taipeiToday());S.loaded=true;S.routed=true;route()})}
window.__aes={S:S,route:route};
start(load,function(err){app.innerHTML='<div class="empty"><b>讀不到資料</b>'+esc(err&&err.message||err)+'</div>'},S);
})();
</script>
